{{ define "main" }}

{{ if .Params.withtoc }}

<div class="section">
    <div style="background-color: #363636; padding: 0.75em 1em; border-radius: 4px 4px 0 0; color: white;">
        <span style="color: white; font-weight: bold;">On this page:</span>
    </div>
    <div style="background-color: #f5f5f5; padding: 1em; border-radius: 0 0 4px 4px;">
        <div class="toc-content">
            <!-- Remove awkward ul bullet  -->
            {{ $toc := .TableOfContents | safeHTML }}
            {{ $toc = replaceRE "^<nav id=\"TableOfContents\">\\s*<ul>\\s*<li>" "<nav id=\"TableOfContents\">" $toc }}
                            {{ $toc = replaceRE "</li>\\s*</ul>\\s*</nav>$" "</nav>" $toc }}
            {{ $toc | safeHTML }}
        </div>
    </div>
</div>

{{ end }}

{{ .Content }}

{{ end }}
